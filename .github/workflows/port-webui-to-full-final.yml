name: Port webui TUF ke basis final penuh (cherry-pick)

# Workflow ini HANYA membuat cabang baru yang penuh, BUKAN build firmware,
# dan TIDAK mengubah cabang webui saja maupun cabang utama.
# Dijalankan MANUAL lewat tombol Run workflow di tab Actions, setelah
# cabang webui TUF-3004.388.13-webui sudah di-push ke repo ini.
# File ini HARUS ada di cabang default (main) supaya muncul di tab Actions;
# GitHub hanya menampilkan workflow yang ada di cabang default.
# Cabang webui TUF-3004.388.13-webui sudah di-push.
# Alasan tidak auto-run saat push: push cabang webui tidak boleh langsung
# memicu pembuatan cabang penuh tanpa perintah Alf.
#
# Kenapa cherry-pick, bukan git merge biasa:
# Cabang webui saja berakar di beta1, sedangkan basis penuh berakar di
# final (388.13-0_GPL_25575). Cabang penuh inilah yang nantinya bernama TUF-3004.388.13,
# sedangkan cabang webui saja bernama TUF-3004.388.13-webui. Git merge biasa akan mencari merge-base lama dan menimbulkan
# banyak konflik, seperti pelajaran merge upstream 31 Okt 2026.
# Cherry-pick satu per satu hanya memindahkan ubahan webui yang sudah
# dibuat di atas file beta1, sehingga seharusnya bersih.
#
# Yang TIDAK di-pick, dengan sengaja:
#  - ea80a20e4 sync www ke beta1 (basis baru sudah final, www-nya sama)
#  - 3a50a2b985 sync www ke final timezone (basis baru sudah punya timezone itu)
# Dua commit perantara HARUS ikut di-pick, walau isinya sudah dibatalkan
# oleh commit sesudahnya, karena commit perbaikan di atasnya butuh
# keadaan file dari commit perantara itu:
#  - 796700a6a ikon Sysinfo toolsys.png (salah) -> bc09fae62 memperbaikinya
#    menjadi sprite emas; melewati 796700a6a membuat bc09fae62 konflik
#    (terbukti di run #1, 5 Nov 2026 21:00 WIT).
#  - 5579db765 logo login flex (sudah dibatalkan) -> dee4eb926 membatalkannya
#    menjadi margin 110px; melewati 5579db765 membuat dee4eb926 konflik.
# Hasil akhir tetap sama persis dengan cabang webui saja, karena pasangan
# perantara+perbaikan itu saling meniadakan, kecuali hasil perbaikannya.
# Kalau ada konflik di luar dugaan, workflow BERHENTI tanpa push,
# supaya Alf yang menyelesaikan, bukan mesin yang menebak.

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Nama cabang baru yang penuh (jangan pakai nama cabang webui saja)"
        required: true
        default: "TUF-3004.388.13"

permissions:
  contents: write
  # CATATAN: token Actions TIDAK BOLEH membuat/mengubah file workflow,
  # dan izin 'workflows: write' TIDAK dikenal di file workflow
  # (GitHub menolak file ini kalau baris itu ditulis — terbukti di
  # run #3/#4, 5 Nov 2026). Karena itu workflow ini MENGHAPUS
  # .github/workflows dari cabang penuh sebelum push (lihat langkah 5
  # di bawah); file workflow untuk build ditambahkan lagi sesudah
  # cabang terbentuk, lewat jalur lain.

jobs:
  port-webui-to-full-final:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo tinkering
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Port webui ke basis final penuh
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGET="${{ inputs.target_branch }}"

          # Jangan menimpa cabang yang sudah ada.
          if git ls-remote --heads origin "$TARGET" | grep -q .; then
            echo "BERHENTI: cabang $TARGET sudah ada di origin, tidak ditimpa."
            exit 1
          fi

          # Basis penuh yang asli: repo utama Alf, cabang tuf-ax3000-388.
          git remote add main https://github.com/alfky12/asuswrt-merlin.ng.git
          # Fetch PENUH, seperti workflow merge upstream: fetch hemat
          # pernah gagal saat cherry-pick meminta blob dadakan.
          git fetch main tuf-ax3000-388
          BASE_HEAD="2172bc4d662dd8b4a73e0eb8fa6f15c9c4ca3f70"
          test "$(git rev-parse main/tuf-ax3000-388)" = "$BASE_HEAD" || {
            echo "BERHENTI: head main/tuf-ax3000-388 bukan final yang sudah diverifikasi ($BASE_HEAD)."
            echo "Periksa dulu sebelum lanjut, jangan pakai basis lain diam-diam."
            exit 1
          }
          git checkout -b "$TARGET" main/tuf-ax3000-388

          # Cabang webui saja, sumber commit porting.
          git fetch origin TUF-3004.388.13-webui

          # Urutan dari lama ke baru, hanya commit porting yang berlaku.
          # Termasuk dua commit perantara (796700a6a, 5579db765) supaya
          # commit perbaikan di atasnya bisa diterapkan bersih.
          for sha in 9bb599eb4 796700a6a bc09fae62 c4990ed62 5579db765 dee4eb926 da078fcf9 f8d9dbaeb f9c57640e 2a46242a9 1be1d4e63 265ff6f48 7819867ed 24b42dce1 e0a5544d8 d40ae3b56 1293379cf 52d6d483a c119da3d5 9c5f15ea2 465aa3569 24c557ef6 00ddb6e90 845ff7a5b 9afbc22a3 f1b08a7ee 0fdf25ec6 72a97dca6 1eaea4162 1ade2dc5a bd8bcad4a 14f9c0252 fdaec24f2 1fda4efee 4dbc903cb e3a675e49 fb26fe08b 2d6abbb18 804e25b36 8d7e71bbd 2611ddf98 16006bfbb 564a13833 1f21377bb 07f58f2a6 f13a0e9ff a1b3102b17 964df5e8eb dad9b440fe; do
            echo "PICK $sha $(git log -1 --format=%s "$sha")"
            if git cherry-pick "$sha" < /dev/null > /tmp/cherry-pick.log 2>&1; then
              continue
            fi
            echo "PICK GAGAL $sha, log:"
            cat /tmp/cherry-pick.log
            echo "File konflik:"
            git ls-files -u
            echo "BERHENTI tanpa push, supaya konflik diselesaikan manual."
            git cherry-pick --abort || true
            exit 1
          done

          # Bukti sebelum push.
          # 1. File www hasil porting harus sama persis dengan cabang webui saja.
          echo "Cek www sama dengan cabang webui saja (harus kosong):"
          git diff origin/TUF-3004.388.13-webui -- release/src/router/www/ | head -50
          test -z "$(git diff origin/TUF-3004.388.13-webui -- release/src/router/www/)" || {
            echo "BERHENTI: www cabang penuh berbeda dengan cabang webui saja."
            exit 1
          }
          # 2. Nomor versi tetap final (0), bukan beta1.
          grep -E '^(SERIALNO|EXTENDNO)=' release/src-rt/version.conf
          grep -q '^EXTENDNO=0_GPL_25575$' release/src-rt/version.conf || {
            echo "BERHENTI: EXTENDNO bukan 0_GPL_25575."
            exit 1
          }
          # 3. Di luar www, tidak ada perubahan dibanding basis final.
          #    Porting webui memang hanya menyentuh www.
          echo "File di luar www yang berubah dibanding basis (harus kosong):"
          git diff --name-only main/tuf-ax3000-388 HEAD | grep -v '^release/src/router/www/' || true
          test -z "$(git diff --name-only main/tuf-ax3000-388 HEAD | grep -v '^release/src/router/www/')" || {
            echo "BERHENTI: ada perubahan di luar www, periksa dulu."
            exit 1
          }
          # 4. Target build TUF tetap 3, seperti cek workflow merge upstream.
          echo "OPENSSL35 untuk TUF: $(grep -c 'export TUF-.*OPENSSL35=y' release/src-rt/target.mak) (harus 3)"
          test "$(grep -c 'export TUF-.*OPENSSL35=y' release/src-rt/target.mak)" = "3"

          # 5. Hapus file workflow dari cabang penuh sebelum push.
          #    Token Actions tidak boleh membuat/mengubah file workflow,
          #    jadi cabang penuh dibuat TANPA .github/workflows.
          #    File workflow untuk build (Building images) ditambahkan
          #    lagi sesudah cabang terbentuk, lewat jalur lain.
          echo "Hapus .github/workflows dari cabang penuh sebelum push:"
          git rm -r -q .github/workflows
          git commit -qm "ci: hapus file workflow dari cabang penuh (token Actions tidak boleh push file workflow)"

          git push origin "HEAD:$TARGET"
          echo "Cabang penuh $TARGET sudah di-push. Build tetap perintah terpisah."
