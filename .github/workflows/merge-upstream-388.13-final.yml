name: Merge upstream Merlin 388.13 final (tanpa GPL/blob baru)

# Workflow ini HANYA menyalin kode, BUKAN build firmware,
# dan HANYA mengubah branch tuf-ax3000-388.
# Ia jalan otomatis saat file workflow ini pertama kali masuk ke branch
# tersebut, atau manual lewat tombol Run workflow di tab Actions.
# Push hasil cherry-pick tidak memicu workflow ini lagi, karena push
# tersebut tidak mengubah file workflow ini (trigger paths di bawah).
#
# PELAJARAN 31 Okt 2026, JANGAN ulangi git merge biasa:
# Branch Alf TIDAK punya parent upstream f94f6ff8, karena commit
# upstream sebelumnya masuk lewat cherry-pick dengan hash berbeda.
# git merge rmerl/3004.388 gagal dengan 67 konflik karena merge-base-nya
# jatuh ke 280221387b (era 388.11), bukan ke f94f6ff8.
# Cara yang benar, mengikuti workflow 388.12_2, 388.13-dev, dan 388.13-beta1,
# adalah cherry-pick satu per satu seperti di bawah, dengan fetch penuh.
#
# 388.13 final vs beta1 (perbandingan 8 Nov 2026):
# RMerl 3004.388 beta1 94195d9b32 -> final d1a59dcffb hanya 3 commit, 5 file.
# Hanya 1 commit kode yang di-pick (timezone); 2 dilewati (changelog/bump).
# TIDAK ada commit GPL/blob di rentang ini, jadi GPL dan blob biner tetap 25575.
# gnuton master masih di 388.11 (SERIALNO=388.11), jadi tidak ada sinkron gnuton.
on:
  push:
    branches: [tuf-ax3000-388]
    paths: [.github/workflows/merge-upstream-388.13-final.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout branch target
        uses: actions/checkout@v4
        with:
          ref: tuf-ax3000-388
          fetch-depth: 0

      - name: Cherry-pick upstream Merlin 388.13 final (sudah terbukti bersih secara lokal untuk daftar ini)
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Kalau commit bump versi final sudah ada, merge sudah pernah dilakukan, jangan diulang.
          if git log --grep="Bump version to 388.13-0_GPL_25575" -1 --format=%H | grep -q .; then
            echo "Merge sudah pernah dilakukan, berhenti."
            exit 0
          fi

          git remote add rmerl https://github.com/RMerl/asuswrt-merlin.ng.git
          # Fetch PENUH tanpa filter dan tanpa batas kedalaman.
          # Alasan: fetch hemat (blob:none/shallow) pernah gagal di run lama
          # saat cherry-pick meminta blob dadakan dari promisor remote.
          git fetch rmerl 3004.388
          # Pastikan head upstream yang di-pick adalah final yang sudah dibandingkan.
          test "$(git rev-parse rmerl/3004.388)" = "d1a59dcffbe0402c7ac8ac3090cb7c928510fbcd" || echo "PERINGATAN: head rmerl/3004.388 bukan d1a59dcffb, periksa daftar commit di bawah sebelum lanjut"
          git log -1 --format=%H\ %s rmerl/3004.388

          # --- RMerl 94195d9b32 -> d1a59dcffb, 3 commit, 1 di-pick, 2 dilewati ---
          # 2 dilewati dengan sengaja, karena versi/changelog diedit manual di akhir:
          #  - e8f8621b9f Updated changelog
          #  - d1a59dcffb Bumped revision to 3004.388.13 final
          # Tidak ada commit GPL/blob di rentang ini, jadi tidak ada
          # pengecualian GPL/blob tambahan di sini. GPL dan blob biner
          # tetap di 388_25575.
          # Urutan dari lama ke baru:
          #  8970d22231 webui: add Vancouver and Edmonton timezones (backport from GPL 40585)
          for sha in 8970d22231; do
            echo "PICK rmerl $sha $(git log -1 --format=%s "$sha")"
            if git cherry-pick "$sha" < /dev/null > /tmp/cherry-pick-initial.log 2>&1; then
              continue
            fi
            echo "PICK GAGAL rmerl $sha, log awal cherry-pick:"
            cat /tmp/cherry-pick-initial.log
            echo "File konflik (ls-files -u):"
            git ls-files -u
            if [ ! -f .git/CHERRY_PICK_HEAD ]; then
              echo "BERHENTI: pick gagal tanpa cherry-pick yang berjalan, lihat log awal di atas."
              exit 1
            fi
            conflicts=$(git ls-files -u | awk '{print $4}' | sort -u)
            echo "CONFLICT pada $sha:"
            echo "$conflicts"
            bad=0
            for f in $conflicts; do
              case "$f" in
                release/src-rt/version.conf|Changelog-NG.txt)
                  git checkout --ours "$f"; git add "$f" ;;
                *)
                  echo "Konflik di luar daftar yang diizinkan: $f"
                  echo "Khususnya: file biner prebuilt / blob TIDAK boleh diambil dari upstream secara otomatis, karena GPL/blob harus tetap 25575."
                  bad=1 ;;
              esac
            done
            if [ "$bad" -ne 0 ]; then
              echo "BERHENTI: konflik tidak dikenal, branch belum di-push."
              git cherry-pick --abort || true
              exit 1
            fi
            remaining=$(git ls-files -u | wc -l)
            if [ "$remaining" -ne 0 ]; then
              echo "Masih ada file konflik, berhenti sebelum continue:"
              git ls-files -u
              git cherry-pick --abort || true
              exit 1
            fi
            if ! GIT_EDITOR=true EDITOR=true git cherry-pick --continue < /dev/null > /tmp/cherry-continue.log 2>&1; then
              echo "Continue gagal, log continue:"
              cat /tmp/cherry-continue.log
              msg=$(git log -1 --format=%s "$sha")
              case "$msg" in
                "Updated documentation"|"Bumped revision"*)
                  git cherry-pick --skip < /dev/null || { echo "Skip juga gagal"; exit 1; } ;;
                *)
                  echo "Continue gagal untuk commit bukan dokumentasi/bump versi, berhenti."
                  exit 1 ;;
              esac
            fi
          done

          # Edit versi secara jujur: basis GPL tetap 25575, ikut nama upstream final (EXTENDNO=0).
          sed -i 's/^EXTENDNO=beta1_GPL_25575$/EXTENDNO=0_GPL_25575/' release/src-rt/version.conf
          grep -E '^(SERIALNO|EXTENDNO)=' release/src-rt/version.conf
          # Blok _tuf di version.conf harus tetap ada (tweak TUF dari branch lama).
          grep -q 'TUF_UI' release/src-rt/version.conf

          # Catatan changelog di paling atas, tanpa menghapus isi lama.
          {
            echo "3004.388.13-0_GPL_25575"
            echo "  - Upstream code to RMerl 3004.388 head d1a59dcffb (3004.388.13 final)"
            echo "  - Synced with upstream 3004.388 final: 1 commit picked, 2 skipped (1 Updated changelog, 1 Bumped revision to final, karena versi/changelog diedit manual)"
            echo "  - GPL and binary blobs kept at 388_25575 (no GPL/blob commit in the 94195d9b32..d1a59dcffb range)"
            echo "  - Timezones: added Vancouver (PST7) and Edmonton (MST6), backport from GPL 40585"
            echo ""
            cat Changelog-NG.txt
          } > /tmp/Changelog-NG.txt && mv /tmp/Changelog-NG.txt Changelog-NG.txt

          git add release/src-rt/version.conf Changelog-NG.txt
          git commit -m "Bump version to 388.13-0_GPL_25575 (GPL/blob kept at 25575)"

          # Bukti cepat sebelum push.
          echo "EXTENDNO: $(grep '^EXTENDNO=' release/src-rt/version.conf)"
          echo "OpenVPN version.m4: $(grep -i '2.7.8' release/src/router/openvpn/version.m4 | head -1)"
          echo "OPENSSL35 untuk TUF: $(grep -c 'export TUF-.*OPENSSL35=y' release/src-rt/target.mak) (harus 3: AX5400, AX3000, AX3000_V2)"
          echo "AiProtection TUF masih symlink: $(ls -l release/src/router/www/sysdep/TUF-AX3000/www/AiProtection_HomeProtection.asp)"
          test "$(grep -c 'export TUF-.*OPENSSL35=y' release/src-rt/target.mak)" = "3"
          test -L release/src/router/www/sysdep/TUF-AX3000/www/AiProtection_HomeProtection.asp

          git push origin HEAD:tuf-ax3000-388
